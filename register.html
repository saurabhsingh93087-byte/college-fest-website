<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2027 - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>TechFest 2027</h1>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="events.html">Events</a> |
    <a href="schedule.html">Schedule</a> |
    <a href="register.html">Register</a> |
    <a href="contact.html">Contact</a>
</nav>

<main>

<h2>Event Registration Form</h2>

<form>

<label for="name">Full Name:</label><br>
<input type="text" id="name" name="name" required><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" required><br><br>

<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone"><br><br>

<label for="department">Department:</label><br>
<input type="text" id="department" name="department"><br><br>

<label for="year">Year of Study:</label><br>
<select id="year" name="year">
    <option>1st Year</option>
    <option>2nd Year</option>
    <option>3rd Year</option>
    <option>4th Year</option>
</select>

<br><br>

<label>Gender:</label><br>

<input type="radio" id="male" name="gender">
<label for="male">Male</label>

<input type="radio" id="female" name="gender">
<label for="female">Female</label>

<input type="radio" id="other" name="gender">
<label for="other">Other</label>

<br><br>

<label>Event Preferences:</label><br>

<input type="checkbox"> Coding Challenge <br>
<input type="checkbox"> Hackathon <br>
<input type="checkbox"> Robotics Competition <br>
<input type="checkbox"> Gaming Tournament <br>
<input type="checkbox"> Project Exhibition <br>

<br>

<label for="message">Why do you want to participate?</label><br>

<textarea id="message" rows="5" cols="40"></textarea>

<br><br>

<input type="submit" value="Register">

<input type="reset" value="Clear">

</form>

</main>

<footer>
    <p>© 2027 TechFest | All Rights Reserved</p>
</footer>

</body>
</html>
